[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leetcode"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["click>=8.0", "tree-sitter>=0.23", "tree-sitter-cpp>=0.23"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-repeat>=0.9", "py-spy>=0.4"]

[project.scripts]
lc = "leetcode.cli:cli"

[tool.setuptools]
packages = ["leetcode"]

[tool.pytest.ini_options]
testpaths = ["tests", "leetcode"]
python_files = ["test_*.py", "p*.py"]
python_functions = ["test_*"]
